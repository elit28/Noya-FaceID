name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controles:
    name: Contrôles du dépôt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: API privées interdites
        run: scripts/check-private-api.sh
      - name: Traductions complètes (fr, en)
        run: python3 scripts/check-localizations.py
      - name: Secrets et modèles sous licence restrictive
        run: scripts/check-repository.sh

  macos:
    name: Compilation, tests et app (macOS)
    # Machines Intel : les machines macOS Apple Silicon gratuites de GitHub sont saturées
    # (« capacity constraints ») et abandonnent la tâche après ~15 min d'attente.
    # L'app est construite en universel (Apple Silicon + Intel).
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Compilation
        run: swift build
      - name: Tests
        run: swift test
      - name: Construction de l’app universelle (signature ad hoc, Hardened Runtime)
        env:
          NOYA_UNIVERSAL: "1"
        run: scripts/build-app.sh "1.0.0" "${{ github.run_number }}"
      - name: Archive de l’app
        run: ditto -c -k --keepParent "dist/NOYA Face.app" "dist/NOYA-Face-dev.zip"
      - name: Image disque (DMG), vérifiée comme pour une publication
        run: |
          mkdir -p dist/dmg
          cp -R "dist/NOYA Face.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "NOYA Face" -srcfolder dist/dmg -ov -format UDZO dist/NOYA-Face-dev.dmg
          hdiutil verify dist/NOYA-Face-dev.dmg
      - name: Publication de l’archive (non notarisée)
        uses: actions/upload-artifact@v4
        with:
          name: NOYA-Face-dev
          path: dist/NOYA-Face-dev.zip
          retention-days: 14
